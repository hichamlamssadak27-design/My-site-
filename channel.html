<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="pageTitle">Browse — Animeog</title>
    <meta name="theme-color" content="#0A0A0F">
    <link rel="icon" href="https://i.postimg.cc/QVG5rNs2/43431dd6704d2787b1bf98d80d7f9b78.jpg" type="image/jpeg">
    <link rel="shortcut icon" href="https://i.postimg.cc/QVG5rNs2/43431dd6704d2787b1bf98d80d7f9b78.jpg" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fullAppContainer">
  <div id="mainPage">
    <div class="site-header">
        <a class="site-title" href="index.html" style="text-decoration:none;cursor:pointer;">Animeog</a>
        <p class="site-tagline" id="channelTagline">Browse</p>
    </div>
    <div class="watch-header" style="max-width:1400px;margin:0 auto 6px;padding:0 16px;">
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
    <div class="section-title"><span class="dot"></span><span id="sectionLabel">Browse</span><span class="line"></span></div>
    <div class="app-container" id="cardContainer"></div>
    <div class="pagination" id="paginationContainer"></div>
    <div class="site-footer">
        <p class="copyright">© 2026 Animeog. All rights reserved.</p>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script>
    const CARDS_PER_PAGE = 10;
    let currentPage = 1;
    let currentList = [];

    const LABELS = {
        most_watched: '🔥 Most Watched',
        new_release:  '🆕 New Release',
        subbed:       '📺 Subbed Anime',
        dubbed:       '📺 Dubbed Anime'
    };

    function buildList(type) {
        if (type === 'most_watched') {
            return [...games].sort((a, b) => parseInt(b.views.replace(/,/g,'')) - parseInt(a.views.replace(/,/g,'')));
        }
        if (type === 'new_release') {
            return games.slice().reverse();
        }
        if (type === 'subbed') {
            return games.filter(function(g){ return g.subDub === 'sub'; });
        }
        if (type === 'dubbed') {
            return games.filter(function(g){ return g.subDub === 'dub'; });
        }
        return games.slice();
    }

    function renderPage(pageNum) {
        const container = document.getElementById('cardContainer');
        container.innerHTML = '';
        const start = (pageNum - 1) * CARDS_PER_PAGE;
        const end = start + CARDS_PER_PAGE;
        currentList.slice(start, end).forEach(function(g){ createAnimeCard(g, games.indexOf(g), container); });
        currentPage = pageNum;
        renderPagination();
    }

    function goToPage(pageNum) {
        renderPage(pageNum);
        document.getElementById('cardContainer').scrollIntoView({behavior:'smooth', block:'start'});
    }

    function renderPagination() {
        const totalPages = Math.ceil(currentList.length / CARDS_PER_PAGE);
        const wrap = document.getElementById('paginationContainer');
        wrap.innerHTML = '';
        if (totalPages <= 1) return;

        const prevBtn = document.createElement('div');
        prevBtn.className = 'page-btn arrow' + (currentPage === 1 ? ' disabled' : '');
        prevBtn.textContent = '‹';
        prevBtn.onclick = function(){ if (currentPage > 1) goToPage(currentPage - 1); };
        wrap.appendChild(prevBtn);

        let windowStart = currentPage - 1;
        let windowEnd = currentPage + 1;
        if (windowStart < 1) { windowStart = 1; windowEnd = Math.min(totalPages, 3); }
        if (windowEnd > totalPages) { windowEnd = totalPages; windowStart = Math.max(1, totalPages - 2); }

        for (let i = windowStart; i <= windowEnd; i++) {
            const btn = document.createElement('div');
            btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
            btn.textContent = i;
            btn.onclick = function(){ goToPage(i); };
            wrap.appendChild(btn);
        }

        const nextBtn = document.createElement('div');
        nextBtn.className = 'page-btn arrow' + (currentPage === totalPages ? ' disabled' : '');
        nextBtn.textContent = '›';
        nextBtn.onclick = function(){ if (currentPage < totalPages) goToPage(currentPage + 1); };
        wrap.appendChild(nextBtn);
    }

    window.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(location.search);
        const type = params.get('type') || 'all';
        const label = LABELS[type] || '📂 All Anime';
        document.getElementById('sectionLabel').textContent = label;
        document.getElementById('channelTagline').textContent = label.replace(/^[^\s]+\s/, '');
        document.title = label.replace(/^[^\s]+\s/, '') + ' — Animeog';
        currentList = buildList(type);
        renderPage(1);
    });
</script>
</body>
</html>
